[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kdaa-app"
version = "0.1.0"
description = "Local, evidence-linked Knowledge Discovery, Assessment and Amplification reference application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4", "SQLAlchemy==2.0.50",
  "alembic==1.18.4", "psycopg[binary]==3.3.3", "python-multipart==0.0.29",
  "pypdf==6.18.1", "python-docx==1.2.0",
  # Optional live-inference provider only; reference mode never imports it.
  # The [crt] extra is needed for profiles created by `aws login` (DPoP-bound tokens).
  "boto3==1.43.93", "botocore[crt]==1.43.93"
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools]
packages = ["kdaa", "kdaa.core", "kdaa.providers", "kdaa_api"]
package-dir = {"" = "src", "kdaa_api" = "services/api/kdaa_api"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured, isolated PostgreSQL test database"]

[tool.ruff]
line-length = 115
target-version = "py312"
