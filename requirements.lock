# Pinned runtime dependency snapshot for Python 3.12/Linux containers.
# pypdf is deliberately pinned to 6.18.1 for upstream security fixes.
# boto3/botocore and their transitive pins are required only by the optional Bedrock provider
# (src/kdaa/providers/bedrock.py). Reference mode never imports them.
# awscrt is botocore's [crt] extra. It is required, not optional, for profiles created by
# `aws login`: that flow issues DPoP proof-of-possession tokens whose signing lives in the AWS
# Common Runtime. Without it botocore raises MissingDependencyException for such a profile.
